<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Хотелки — список на двоих</title>
<meta name="description" content="Общий вишлист, ссылки, места и идеи для двоих. Работает офлайн, синхронизируется через GitHub Gist.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F4F1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хотелки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<style>
  :root{
    --paper:#F4F1F7; --surface:#FCFAFE; --surface-2:#F3EEF8;
    --ink:#221E2A; --ink-soft:#6B6376; --ink-faint:#9990A4;
    --line:#E7E0EE; --line-strong:#D9D0E4;
    --accent:#7A4FD0; --accent-2:#C2509A; --accent-soft:#EFE8FA; --on-accent:#FEFCFF;
    --ok:#2E9E6B; --ok-soft:#E4F3EC; --danger:#B23A46;
    --a:#7A4FD0; --b:#C2509A;
    --sans:-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --shadow:0 1px 2px rgba(34,30,42,.05),0 6px 18px rgba(34,30,42,.07);
    --shadow-lg:0 -8px 40px rgba(34,30,42,.18);
    --shadow-fab:0 6px 20px rgba(122,79,208,.35);
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#151319; --surface:#1F1C26; --surface-2:#272231;
    --ink:#ECE6F2; --ink-soft:#A79FB4; --ink-faint:#746C81;
    --line:#2E2A38; --line-strong:#3C3648;
    --accent:#B49BF0; --accent-2:#E087BC; --accent-soft:#2A2440; --on-accent:#171320;
    --ok:#5FCF97; --ok-soft:#1E2E27; --danger:#E88490;
    --a:#B49BF0; --b:#E087BC;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.4);
    --shadow-lg:0 -8px 40px rgba(0,0,0,.5);
    --shadow-fab:0 6px 20px rgba(0,0,0,.5);
  }}
  :root[data-theme="dark"]{
    --paper:#151319; --surface:#1F1C26; --surface-2:#272231;
    --ink:#ECE6F2; --ink-soft:#A79FB4; --ink-faint:#746C81;
    --line:#2E2A38; --line-strong:#3C3648;
    --accent:#B49BF0; --accent-2:#E087BC; --accent-soft:#2A2440; --on-accent:#171320;
    --ok:#5FCF97; --ok-soft:#1E2E27; --danger:#E88490; --a:#B49BF0; --b:#E087BC;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.4);
    --shadow-lg:0 -8px 40px rgba(0,0,0,.5); --shadow-fab:0 6px 20px rgba(0,0,0,.5);
  }
  :root[data-theme="light"]{
    --paper:#F4F1F7; --surface:#FCFAFE; --surface-2:#F3EEF8;
    --ink:#221E2A; --ink-soft:#6B6376; --ink-faint:#9990A4;
    --line:#E7E0EE; --line-strong:#D9D0E4;
    --accent:#7A4FD0; --accent-2:#C2509A; --accent-soft:#EFE8FA; --on-accent:#FEFCFF;
    --ok:#2E9E6B; --ok-soft:#E4F3EC; --danger:#B23A46; --a:#7A4FD0; --b:#C2509A;
    --shadow:0 1px 2px rgba(34,30,42,.05),0 6px 18px rgba(34,30,42,.07);
    --shadow-lg:0 -8px 40px rgba(34,30,42,.18); --shadow-fab:0 6px 20px rgba(122,79,208,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  html{background:var(--paper)}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;overscroll-behavior:none}
  button{font-family:inherit;color:inherit;cursor:pointer}
  textarea,input{font-family:inherit}
  a{color:var(--accent)}

  #app{max-width:600px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    background:var(--paper);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
  @media (max-width:600px){#app{border:none}}

  /* topbar */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .brand .logo{width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(150deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:var(--shadow)}
  .brand .logo svg{width:17px;height:17px;color:#fff}
  .brand .title{font-size:18px;font-weight:750;letter-spacing:-.2px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .icon-btn{background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;width:38px;height:38px;
    display:grid;place-items:center;color:var(--ink-soft);flex:0 0 auto;position:relative}
  .icon-btn:active{background:var(--surface-2)}
  .icon-btn svg{width:19px;height:19px}
  .icon-btn.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .icon-btn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
    border:2px solid var(--paper)}
  .dot.dirty{background:var(--accent-2)} .dot.err{background:var(--danger)}
  .who{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:13px;font-weight:750;color:#fff;border:none}

  /* category chips */
  .cats{flex:0 0 auto;display:flex;gap:7px;overflow-x:auto;padding:6px 12px 10px;-webkit-overflow-scrolling:touch;
    scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--surface);
    border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;
    color:var(--ink-soft);white-space:nowrap}
  .chip:active{transform:scale(.96)}
  .chip .em{font-size:15px}
  .chip .cnt{font-size:11.5px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .chip.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip.cur .cnt{color:color-mix(in srgb,var(--on-accent) 75%,transparent)}
  .chip.add{color:var(--accent);border-style:dashed;font-weight:700}

  /* feed */
  .feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px 120px;
    display:flex;flex-direction:column;gap:9px}
  .sec-h{display:flex;align-items:center;gap:8px;margin:12px 4px 2px}
  .sec-h .t{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--ink-faint)}
  .sec-h .ln{flex:1;height:1px;background:var(--line)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:12px 13px;
    box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
    transition:transform .1s ease}
  .card:active{transform:scale(.992)}
  .card.done{opacity:.62}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);
    background:var(--surface-2);display:grid;place-items:center;margin-top:1px;transition:.12s}
  .check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:.12s}
  .check.on{background:var(--ok);border-color:var(--ok)} .check.on svg{opacity:1;transform:scale(1)}
  .c-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;
    background:none;border:none;padding:0;font:inherit;text-align:left}
  .c-title{font-size:15.5px;font-weight:600;line-height:1.35;color:var(--ink);word-break:break-word}
  .card.done .c-title{text-decoration:line-through;text-decoration-color:var(--ink-faint);color:var(--ink-soft)}
  .c-note{font-size:13px;line-height:1.45;color:var(--ink-soft);word-break:break-word;white-space:pre-wrap}
  .c-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px}
  .c-link{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent);
    border:none;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:650;max-width:100%;overflow:hidden}
  .c-link svg{width:12px;height:12px;flex:0 0 auto} .c-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-by{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-faint);font-weight:600}
  .c-by .av{width:15px;height:15px;border-radius:50%;font-size:8.5px;font-weight:800;color:#fff;display:grid;place-items:center}

  .empty{margin:auto;text-align:center;color:var(--ink-soft);padding:40px 30px}
  .empty .mk{font-size:44px;line-height:1;margin-bottom:12px}
  .empty h2{font-weight:700;font-size:18px;margin:0 0 8px;color:var(--ink)}
  .empty p{font-size:14px;line-height:1.55;max-width:280px;margin:0 auto}

  /* composer / fab */
  .composer{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;gap:9px;
    padding:9px 12px calc(env(safe-area-inset-bottom) + 10px);
    background:linear-gradient(0deg,var(--paper) 62%,transparent);pointer-events:none}
  .composer>*{pointer-events:auto}
  .composer .box{flex:1;display:flex;align-items:flex-end;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:22px;padding:2px;box-shadow:var(--shadow)}
  .composer textarea{flex:1;border:none;background:none;outline:none;resize:none;color:var(--ink);
    font-size:16px;line-height:1.4;padding:9px 6px 9px 15px;max-height:40vh;min-height:22px}
  .composer .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .mini{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:none;background:var(--surface-2);
    color:var(--ink-soft);display:grid;place-items:center;margin:2px}
  .mini svg{width:18px;height:18px}
  .send{flex:0 0 auto;width:48px;height:48px;border-radius:50%;border:none;
    background:linear-gradient(150deg,var(--a),var(--b));color:#fff;display:grid;place-items:center;
    box-shadow:var(--shadow-fab);transition:transform .1s,opacity .15s}
  .send svg{width:23px;height:23px}
  .send:disabled{opacity:.45;box-shadow:none}
  .send:active:not(:disabled){transform:scale(.9)}

  /* sheets */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(20,16,26,.46);opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:0;z-index:41;width:100%;max-width:600px;
    max-height:92dvh;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
    display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.32,.72,0,1);
    border:1px solid var(--line);border-bottom:none}
  .sheet.show{transform:translate(-50%,0)}
  .grip{width:38px;height:4px;border-radius:99px;background:var(--line-strong);margin:9px auto 2px;flex:0 0 auto}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:6px 18px 8px;flex:0 0 auto}
  .sheet-head h2{font-size:17px;font-weight:750;margin:0;flex:1;letter-spacing:-.2px}
  .sheet-head .txtbtn{background:none;border:none;font-size:15px;color:var(--ink-soft);padding:6px;font-weight:600}
  .sheet-head .txtbtn.primary{color:var(--accent);font-weight:750}
  .sheet-body{overflow-y:auto;padding:4px 18px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;gap:11px}

  .field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--ink-faint);margin-bottom:7px}
  .input{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;
    padding:12px 13px;font-size:16px;color:var(--ink);outline:none}
  .input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.input{resize:none;line-height:1.5;min-height:70px}
  .row2{display:flex;gap:9px} .row2>*{flex:1;min-width:0}

  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:13px;padding:14px;
    font-size:15.5px;font-weight:750;border:1px solid transparent}
  .btn svg{width:18px;height:18px}
  .btn.primary{background:linear-gradient(150deg,var(--a),var(--b));color:#fff}
  .btn.ghost{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink)}
  .btn.danger{background:none;color:var(--danger);font-weight:650}
  .btn:disabled{opacity:.5}
  .actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}

  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface-2);
    border:1px solid var(--line);border-radius:13px;padding:14px 15px;font-size:15px;font-weight:650;color:var(--ink)}
  .opt:active{background:var(--line)}
  .opt .em{font-size:19px;flex:0 0 auto;width:24px;text-align:center}
  .opt .mi{flex:1;min-width:0} .opt .sub{font-size:11.5px;font-weight:500;color:var(--ink-faint);margin-top:1px}
  .opt.cur{border-color:var(--accent);background:var(--accent-soft)}
  .opt .chk{color:var(--accent);display:none;flex:0 0 auto} .opt.cur .chk{display:flex}
  .opt.danger{color:var(--danger)}

  .picker{display:flex;flex-wrap:wrap;gap:8px}
  .pick{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:11px;padding:9px 11px;font-size:18px}
  .pick.cur{border-color:var(--accent);background:var(--accent-soft)}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px;font-size:13.5px;font-weight:650;color:var(--ink-soft)}
  .seg button.cur{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .note-info{font-size:12.5px;line-height:1.5;color:var(--ink-soft);background:var(--surface-2);
    border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .note-info b{color:var(--ink)}
  .status{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);padding:2px}
  .status .pip{width:8px;height:8px;border-radius:50%;background:var(--ink-faint);flex:0 0 auto}
  .status .pip.ok{background:var(--ok)} .status .pip.err{background:var(--danger)}

  .toast{position:fixed;left:50%;transform:translate(-50%,20px);z-index:60;bottom:calc(env(safe-area-inset-bottom) + 92px);
    background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:650;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:82%;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  ::selection{background:var(--accent-soft);color:var(--ink)}
  button:focus-visible,.input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <div class="cats" id="cats"></div>
  <div class="feed" id="feed"></div>
  <div class="composer">
    <button class="mini" id="detailBtn" aria-label="Подробнее" title="Добавить с деталями">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="8" x2="20" y2="8"/><line x1="4" y1="14" x2="14" y2="14"/><line x1="4" y1="20" x2="18" y2="20"/></svg>
    </button>
    <div class="box"><textarea id="input" rows="1" placeholder="Хочу… или вставь ссылку" autocomplete="off" enterkeyhint="done"></textarea></div>
    <button class="send" id="send" aria-label="Добавить" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
    </button>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sheet-head" id="sheetHead"></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
<script>
  if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
